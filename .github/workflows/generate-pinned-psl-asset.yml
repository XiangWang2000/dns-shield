name: Generate pinned PSL asset

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'agent/package-production-psl-asset'
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pinned IDNA dependency
        run: python -m pip install --require-hashes -r tools/requirements-public-suffix.txt

      - name: Rebuild pinned production artifact
        shell: pwsh
        run: ./prepare-public-suffix-production.ps1

      - name: Install verified main asset
        shell: pwsh
        run: ./install-public-suffix-asset.ps1

      - name: Verify packaged source asset
        run: >-
          python tools/verify_public_suffix_asset.py
          --manifest tools/public_suffix_production.json
          --asset app/src/main/assets/public_suffix.bin

      - name: Commit exact verified asset
        shell: bash
        run: |
          git add app/src/main/assets/public_suffix.bin
          if git diff --cached --quiet; then
            echo "Verified asset already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package verified Public Suffix asset"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
