name: Patch PSL runtime diagnostics

on:
  push:
    branches:
      - agent/wire-psl-parent-domain-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Log Public Suffix runtime policy status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wire-psl-parent-domain-policy

      - name: Patch runtime diagnostic
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/src/main/java/io/github/xiangwang2000/dnsshield/service/DnsVpnService.kt')
          text = path.read_text(encoding='utf-8')
          old = '        addLog(DomainPolicyDiagnostics.message(status))\n'
          new = '''        addLog(DomainPolicyDiagnostics.message(status))
        if (status is CompiledBlocklistStatus.Loaded) {
            DomainPolicyDiagnostics
                .publicSuffixMessage(publicSuffixResolverOwner.status())
                ?.let { message -> addLog(message) }
        }
'''
          if old not in text and new not in text:
              raise SystemExit('Expected policy diagnostic anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

      - name: Commit diagnostic wiring
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Runtime diagnostic already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/io/github/xiangwang2000/dnsshield/service/DnsVpnService.kt
          git commit -m "Log Public Suffix runtime policy status"
          git push origin HEAD:agent/wire-psl-parent-domain-policy
