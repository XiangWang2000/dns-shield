name: Patch release candidate

on:
  push:
    branches:
      - agent/prepare-1.2.0-release-candidate

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Prepare 1.2.0 release candidate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prepare-1.2.0-release-candidate

      - name: Patch release candidate files
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace_once(
              'app/build.gradle.kts',
              '    versionCode = 2\n    versionName = "1.1.0"',
              '    versionCode = 3\n    versionName = "1.2.0"'
          )

          replace_once(
              'verify.ps1',
              '    "install-public-suffix-asset.ps1",\n    "benchmark-runtime-domain-policy-android.ps1"',
              '    "install-public-suffix-asset.ps1",\n    "benchmark-runtime-domain-policy-android.ps1",\n    "release.ps1"'
          )

          replace_once(
              'release.ps1',
              'Set-Location $Root\nWrite-Host "==> Building signed release APK"',
              'Set-Location $Root\nWrite-Host "==> Running repository verification"\n& .\\verify.ps1\nif ($LASTEXITCODE -ne 0) {\n    throw "Repository verification failed with exit code $LASTEXITCODE."\n}\n\nWrite-Host "==> Building signed release APK"'
          )

          replace_once(
              'README.md',
              '- 阻擋規則已由可單元測試的 `DomainMatcher` 元件處理，並保留既有的決策快取與 VPN DNS 熱路徑行為。',
              '- 阻擋規則已由可單元測試的 `DomainMatcher` 元件處理，並保留既有的決策快取與 VPN DNS 熱路徑行為。\n- 若 App 私有 `blocklists/active.bin` 存在且驗證通過，可套用 compiled blocklist；parent-domain matching 受 APK 內已驗證的 Public Suffix List 邊界限制。'
          )

          replace_once(
              'README.md',
              '- 專案提供本機離線 blocklist 編譯器，但產生的清單目前尚未載入 App；它不會改變現有 APK 的攔截行為。',
              '- App 可從私有儲存載入經驗證的 `blocklists/active.bin` compiled blocklist；目前不會自動下載或更新遠端規則，檔案缺失或損壞時會安全退回內建規則。'
          )

          replace_once(
              'README.md',
              '二進位格式請參閱 [docs/blocklist-format.md](docs/blocklist-format.md)。第一版只接受本機文字清單，不會下載遠端來源，也尚未接入 VPN 熱路徑。',
              '二進位格式請參閱 [docs/blocklist-format.md](docs/blocklist-format.md)。編譯器仍只接受本機文字清單，不會下載遠端來源；production runtime 只在 App 私有 `blocklists/active.bin` 存在且驗證通過時載入，否則維持內建規則。'
          )

          replace_once(
              'README.md',
              '腳本只把 artifact 複製到 `app/build/generated` 的 androidTest asset，不會打包進正式 APK；結果會拉回 `build/public-suffix.android-benchmark.json`。測試流程、指標解讀與先前 ASUS_Z01RD 粗略 baseline 請參閱 [docs/public-suffix-android-benchmark.md](docs/public-suffix-android-benchmark.md)。完整 PSL 仍未接入 VPN。',
              '腳本只把 benchmark artifact 複製到 `app/build/generated` 的 androidTest asset；結果會拉回 `build/public-suffix.android-benchmark.json`。Production APK 另包含已釘選且驗證的 PSL asset，只有有效 `active.bin` 需要 parent-domain matching 時才由 service lifecycle lazy 載入；載入失敗時 compiled blocklist 退回 exact-only。測試流程與指標解讀請參閱 [docs/public-suffix-android-benchmark.md](docs/public-suffix-android-benchmark.md)。'
          )

          replace_once(
              'README.md',
              '正式套件識別為 `io.github.xiangwang2000.dnsshield`。目前發行版本為 `1.1.0`、`versionCode 2`；不要變更 `applicationId`，每次發布新版都必須增加 `versionCode`。',
              '正式套件識別為 `io.github.xiangwang2000.dnsshield`。目前程式版本為 `1.2.0`、`versionCode 3`；不要變更 `applicationId`，每次發布新版都必須增加 `versionCode`。'
          )

          Path('docs/release-1.2.0.md').write_text('''# DNS Shield 1.2.0 Release Candidate\n\nThis document is the release gate for DNS Shield 1.2.0 (`versionCode 3`). The release-candidate PR intentionally adds no new VPN or DNS runtime behavior.\n\n## Release highlights\n\n- Production Public Suffix List packaging and contract verification.\n- Lifecycle-scoped PSL loading only when a validated app-private `blocklists/active.bin` needs parent-domain matching.\n- Bounded parent-domain matching for compiled blocklists without changing exact allowlist semantics or built-in matcher behavior.\n- Fail-safe fallback: missing or malformed compiled blocklists keep built-in protection; PSL load failure keeps a validated compiled blocklist exact-only.\n- Reduced steady PSL-backed policy memory after the sorted-array resolver work.\n- Repeatable Android instrumentation benchmarks for production asset loading and runtime policy composition.\n\n## PR #26 device characterization\n\nASUS_Z01RD / Android 10 / API 29 / arm64-v8a, two independent runs:\n\n- missing-`active.bin` assembly p95: 0.173 / 0.166 ms\n- first active-policy assembly: 273.798 / 270.161 ms\n- cached active-policy assembly p95: 0.972 / 0.970 ms\n- parent-aware lookup p95: 18.010 / 17.525 us\n- steady exact-policy heap median: 16 / 16 KiB\n- steady parent-policy heap median: 576 / 0 KiB\n- steady parent incremental heap median: 560 / 0 KiB\n\nThe steady heap metric is GC-assisted; the zero result is measurement noise rather than zero memory. The repeated runs support a low-memory steady-state characterization and close the PSL optimization gate for this release.\n\n## Automated release gate\n\nRun:\n\n```powershell\npowershell -NoProfile -ExecutionPolicy Bypass -File .\\verify.ps1\n```\n\n`release.ps1` now runs the same repository verification before attempting the signed release build.\n\n## Manual smoke checklist\n\nBefore tagging `v1.2.0`:\n\n- [ ] Upgrade a signed 1.1.0 installation to the 1.2.0 release candidate without uninstalling; confirm settings remain available.\n- [ ] Start, stop, and restart DNS Shield; confirm the foreground VPN notification and running state stay consistent.\n- [ ] Resolve a normal domain through at least one built-in DoH resolver.\n- [ ] Confirm a known built-in blocked domain receives the expected blocked/NXDOMAIN behavior.\n- [ ] Switch DNS resolver while the VPN is running and confirm subsequent queries use the new resolver without stale cached state.\n- [ ] Exercise a custom DNS server so the UDP path still resolves normally.\n- [ ] Confirm an excluded App remains outside the DNS Shield VPN path.\n- [ ] Background and foreground the UI; confirm statistics/log display resumes without affecting DNS resolution.\n- [ ] Turn the screen off and wake the device; confirm the VPN continues to resolve DNS after wake.\n- [ ] Switch between available network transports (for example Wi-Fi and mobile data) and confirm DNS recovers.\n- [ ] With no `blocklists/active.bin`, confirm built-in-only behavior.\n- [ ] If using a test fixture, confirm a valid `active.bin` blocks a subdomain through bounded parent matching and a malformed artifact safely falls back.\n- [ ] Complete one 8-10 hour same-device battery observation and compare against the current approximately 27% / 10-hour reference rather than accepting a clear regression.\n\n## Signed artifact gate\n\nWith the existing release signing key configured, run:\n\n```powershell\npowershell -NoProfile -ExecutionPolicy Bypass -File .\\release.ps1\n```\n\nBefore publishing GitHub Release `v1.2.0`:\n\n- [ ] `app/build/outputs/apk/release/app-release.apk` exists.\n- [ ] `apksigner verify --verbose --print-certs` passes through `release.ps1`.\n- [ ] `app-release.apk.sha256` is generated and matches the APK.\n- [ ] The signed APK upgrades the existing 1.1.0 installation successfully.\n- [ ] Attach the APK and checksum to the GitHub Release and use the release highlights above as the release-note basis.\n''', encoding='utf-8', newline='\n')

      - name: Commit release candidate changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts verify.ps1 release.ps1 README.md docs/release-1.2.0.md
          git commit -m "Prepare 1.2.0 release candidate"
          git push origin HEAD:agent/prepare-1.2.0-release-candidate
