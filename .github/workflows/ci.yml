name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows verification
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Select verification scope
        id: scope
        run: python tools/ci.py classify --event "$env:GITHUB_EVENT_PATH" --output "$env:GITHUB_OUTPUT"
        shell: powershell

      - name: Verify CI routing and documentation
        run: |
          python -m unittest discover tools/tests -p test_ci.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci.py verify-docs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell

      - name: Check out native submodules
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          git submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: powershell

      - name: Set up JDK
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          # Adoptium semver for Temurin 21.0.12.1+1 (patch 1).
          java-version: "21.0.12+101.0.LTS"
          cache: gradle

      - name: Verify repository
        if: steps.scope.outputs.docs_only != 'true'
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\verify.ps1
        shell: powershell

      - name: Upload test and lint reports
        if: always() && steps.scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-reports-${{ github.run_id }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14
