name: Validate PR25 branch

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    if: github.head_ref == 'agent/add-runtime-policy-android-benchmark'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: PowerShell benchmark runner syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'benchmark-runtime-domain-policy-android.ps1'),
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
              throw (($errors | ForEach-Object Message) -join '; ')
          }

      - name: Python verification
        run: python -m unittest discover tools/tests

      - name: Verify packaged production PSL asset
        run: >-
          python tools/verify_public_suffix_asset.py
          --manifest tools/public_suffix_production.json
          --asset app/src/main/assets/public_suffix.bin

      - name: Gradle build and tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin
