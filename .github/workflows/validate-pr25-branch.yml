name: Validate PR25 branch

on:
  push:
    branches:
      - agent/add-runtime-policy-android-benchmark

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record PR25 branch validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/add-runtime-policy-android-benchmark

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: PowerShell benchmark runner syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD 'benchmark-runtime-domain-policy-android.ps1'),
              [ref]$tokens,
              [ref]$errors
          ) | Out-Null
          if ($errors.Count -ne 0) {
              throw (($errors | ForEach-Object Message) -join '; ')
          }

      - name: Python verification
        run: python -m unittest discover tools/tests

      - name: Verify packaged production PSL asset
        run: >-
          python tools/verify_public_suffix_asset.py
          --manifest tools/public_suffix_production.json
          --asset app/src/main/assets/public_suffix.bin

      - name: Gradle build and tests
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin

      - name: Record successful validation
        shell: bash
        run: |
          printf '%s\n' \
            'powershell_syntax=success' \
            'python_tests=success' \
            'asset_contract=success' \
            'gradle=success' > .github/pr25-validation-passed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr25-validation-passed
          git commit -m "Record PR25 branch validation"
          git push origin HEAD:agent/add-runtime-policy-android-benchmark
