name: Validate PR24 branch

on:
  push:
    branches:
      - agent/wire-psl-parent-domain-policy

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record PR24 branch validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/wire-psl-parent-domain-policy

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - id: python_tests
        name: Python verification
        continue-on-error: true
        run: python -m unittest discover tools/tests

      - id: asset_contract
        name: Verify packaged production PSL asset
        continue-on-error: true
        run: >-
          python tools/verify_public_suffix_asset.py
          --manifest tools/public_suffix_production.json
          --asset app/src/main/assets/public_suffix.bin

      - id: gradle
        name: Gradle build and tests
        continue-on-error: true
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain \
            :app:assembleDebug \
            :app:assembleDebugAndroidTest \
            :app:testDebugUnitTest \
            :app:compileDebugKotlin

      - name: Record validation outcomes
        if: always()
        shell: bash
        run: |
          cat > .github/pr24-validation-passed <<EOF
          python_tests=${{ steps.python_tests.outcome }}
          asset_contract=${{ steps.asset_contract.outcome }}
          gradle=${{ steps.gradle.outcome }}
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/pr24-validation-passed
          git commit -m "Record PR24 branch validation"
          git push origin HEAD:agent/wire-psl-parent-domain-policy
